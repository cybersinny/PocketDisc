<style>
:root{--ink:#5a2a49;--hot:#ff7ab8}
*{box-sizing:border-box}
body{margin:0;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);background:#ffc9e3}
body{overflow:hidden;height:100vh}#pan{position:fixed;inset:0}#rot{position:fixed;inset:0;display:none;place-items:center;background:#ffc9e3;z-index:99;font-size:26px;text-align:center}@media (orientation:portrait){#rot{display:grid}}
#room{position:absolute;transform-origin:0 0;width:1000px;height:700px;overflow:hidden;
 background:radial-gradient(circle at 25% 10%,#fffb,#fff0 45%),repeating-linear-gradient(90deg,#ffd6ea 0 38px,#ffc6e0 38px 40px)}
.st{position:absolute;color:#fff;text-shadow:0 0 6px #ff9ad0;animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.25;transform:scale(.6)}}
.top{position:absolute;top:10px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:5}
.top button{font:inherit;font-size:15px;padding:4px 14px;border:2px solid #fff;border-radius:99px;background:linear-gradient(#ffe3f1,#ff9ad0);color:var(--ink);cursor:pointer}
button:hover{filter:drop-shadow(0 0 6px #fff)}
.win{position:absolute;left:50px;top:60px;width:190px;height:170px;border:8px solid #fff;border-radius:8px;background:linear-gradient(#9fd8ff,#e6f6ff);box-shadow:0 0 0 2px #ffb3d6}
.win::before,.win::after{content:'';position:absolute;background:#fff}
.win::before{left:50%;top:0;bottom:0;width:6px}.win::after{top:50%;left:0;right:0;height:6px}
.pos{position:absolute;top:50px;width:90px;height:120px;border-radius:4px;display:grid;place-items:center;font-size:34px;box-shadow:2px 3px 0 #0002;color:#fff}
.tv{position:absolute;right:30px;top:60px;width:220px;padding:8px 8px 4px;background:#cfe9ff;border:3px solid #fff;border-radius:18px;text-align:center;font-size:13px;box-shadow:0 4px 0 #8fb8dd}
#yt{width:200px;height:200px;background:#222;border-radius:8px;overflow:hidden}
.board{position:absolute;left:20px;right:20px;bottom:116px;height:24px;background:linear-gradient(#fff,#ffb3d6);border-radius:6px;box-shadow:0 4px 0 #d77fae}
.cab{position:absolute;left:20px;right:20px;bottom:0;height:116px;display:flex;gap:10px;padding:14px;background:#ffe3f1;border-radius:0 0 10px 10px;box-shadow:inset 0 0 0 3px #fff}
.dr{flex:1;background:#fff5fa;border:3px solid #ffb3d6;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;z-index:3;transition:transform .3s,box-shadow .3s}.dr.open{transform:translateY(-26px) scale(1.03);box-shadow:0 10px 0 #d77fae;background:#fff}.nm{font:inherit;font-size:15px;border:0;background:none;cursor:pointer;color:var(--ink)}.dr .in{display:none;gap:5px;align-items:center;justify-content:center}.dr.open .in{display:flex}.stk{font-size:26px;cursor:grab;touch-action:none;user-select:none}.placed{position:absolute;font-size:26px;cursor:grab;touch-action:none;z-index:6;user-select:none}
/* discs */
.cd{--s:160px;width:var(--s);height:var(--s);border-radius:50%;position:relative;flex:none;font-size:calc(var(--s)/11);
 background:conic-gradient(#eee,#aaa,#fff,#bbb,#eee,#ccc,#fff,#aaa,#eee);background-size:cover;box-shadow:0 2px 6px #0004}
.cd.home{background:radial-gradient(circle,transparent 0 12%,var(--c) 12.5%),conic-gradient(#eee,#aaa,#fff,#bbb,#eee)}
.cd::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff0,#fff8 12%,#fff0 25%,#fff7 50%,#fff0 75%)}
.cd::after{content:'';position:absolute;inset:43%;border-radius:50%;background:#ffeaf4;box-shadow:inset 0 0 0 2px #0002}
.cd b{position:absolute;left:12%;right:12%;top:17%;text-align:center;line-height:1.05;font:400 1em 'Permanent Marker',cursive;color:var(--ink,#222);transform:rotate(-6deg);z-index:1}
.cd i{position:absolute;left:0;right:0;bottom:17%;text-align:center;font:400 .8em 'Permanent Marker',cursive;color:var(--ink,#222);z-index:1}
.cd svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}.cd text{font:7px 'Permanent Marker',cursive;fill:var(--ink,#222)}
img.pos{display:block;width:92px;height:123px;object-fit:cover;border:4px solid #fff;background:#fff;cursor:pointer}
/* decorations */
.it{position:relative;display:block}
.slot{position:absolute;bottom:140px;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;transition:filter .2s}
.slot:hover{filter:drop-shadow(0 0 8px #fff)}.slot.sel{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 5px #ff7ab8)}
.slot.pop .it{animation:pop .4s}@keyframes pop{50%{transform:scale(1.15) rotate(4deg)}}
.mini{position:relative;width:32px;height:46px;flex:none;cursor:pointer;overflow:hidden}.mini.on{opacity:.4}.mini *{pointer-events:none}
.mini>.it{position:absolute;left:0;bottom:0;transform-origin:0 100%}
.tama{width:68px;height:84px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:linear-gradient(145deg,#d6f0ff,#8fc8ff);box-shadow:0 3px 0 #5c9ad6,inset 0 0 0 3px #fff9}
.tama b{position:absolute;left:14px;top:16px;width:40px;height:32px;border-radius:6px;background:#b9cba2;box-shadow:inset 0 2px 4px #0005;font:18px/32px 'VT323',monospace;text-align:center;color:#25361a}
.tama i{position:absolute;bottom:12px;width:10px;height:10px;border-radius:50%;background:#ff7ab8}
.tama i:nth-of-type(1){left:15px}.tama i:nth-of-type(2){left:29px}.tama i:nth-of-type(3){left:43px}
.gbc{width:90px;height:140px;border-radius:8px 8px 24px 8px;background:linear-gradient(145deg,#d9b8ff,#9b6ee0);box-shadow:0 3px 0 #6b43b0,inset 0 0 0 3px #ffffff80}
.gbc b{position:absolute;left:12px;top:12px;width:66px;height:54px;border-radius:5px 5px 14px 5px;background:#3d3a52}
.gbc b::after{content:'';position:absolute;left:11px;top:9px;width:44px;height:36px;background:#9bbc7a}
.gbc i{position:absolute;width:14px;height:14px;border-radius:50%;background:#ff7ab8}
.gbc i:nth-of-type(1){left:12px;top:84px;width:30px;height:30px;border-radius:6px;background:#2d2540}.gbc i:nth-of-type(2){left:62px;top:84px}.gbc i:nth-of-type(3){left:48px;top:100px}
.furby{width:84px;height:86px;margin-top:18px;border-radius:50% 50% 44% 44%;background:radial-gradient(circle at 50% 62%,#fff 0 26%,#c9a6ff 27%);box-shadow:0 3px 0 #8d68c8}
.furby::before,.furby::after{content:'';position:absolute;top:-18px;width:22px;height:34px;border-radius:50% 50% 10% 10%;background:#c9a6ff}
.furby::before{left:10px;transform:rotate(-12deg)}.furby::after{right:10px;transform:rotate(12deg)}
.furby b{position:absolute;top:20px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 2px #0002}
.furby b::after{content:'';position:absolute;left:8px;top:8px;width:9px;height:9px;border-radius:50%;background:#222}
.furby b:nth-of-type(1){left:10px}.furby b:nth-of-type(2){right:10px}
.furby i{position:absolute;left:34px;top:46px;width:16px;height:12px;background:#ffb347;clip-path:polygon(0 0,100% 0,50% 100%)}
.glass{width:104px;height:44px}
.glass b{position:absolute;top:0;width:44px;height:44px;border-radius:50%;border:4px solid #ffb3d6;background:#ffffff40;box-shadow:inset 0 0 8px #fff9}
.glass b:nth-of-type(1){left:0}.glass b:nth-of-type(2){right:0}.glass i{position:absolute;left:42px;top:14px;width:20px;height:5px;border-radius:3px;background:#ffb3d6}
.nokia{width:56px;height:116px;border-radius:14px 14px 20px 20px;background:linear-gradient(#8fa4cc,#566b96);box-shadow:0 3px 0 #3a4a6e}
.nokia b{position:absolute;left:8px;top:14px;width:40px;height:32px;border-radius:3px;background:#b9cba2;box-shadow:inset 0 2px 4px #0006}
.nokia u{position:absolute;left:8px;top:56px;width:40px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nokia u i{display:block;height:7px;border-radius:3px;background:#dfe8ff}
.polly{width:104px;height:92px}
.polly i{position:absolute;left:8px;top:0;width:88px;height:64px;border-radius:50% 50% 8px 8px;background:linear-gradient(#fff,#ffc4df);box-shadow:inset 0 0 0 4px #ff9ad0}
.polly b{position:absolute;left:0;bottom:0;width:104px;height:50px;border-radius:50%;background:linear-gradient(#ffd6ea,#ff9ad0);box-shadow:0 3px 0 #d7609b}
.polly u{position:absolute;left:26px;bottom:14px;width:52px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#9fd8ff 55%,#c9a6ff)}
.polly s{position:absolute;left:38px;bottom:26px;font-size:28px;text-decoration:none}
#hp{display:none;position:absolute;left:640px;bottom:140px;width:130px;height:180px;pointer-events:none}.dm.portable~#hp{display:block}
/* hanging holographic CDs */
.hang{position:absolute;top:0;width:2px;height:var(--l);background:#ffffffcc;transform-origin:50% 0;animation:swing 4s ease-in-out infinite alternate;pointer-events:none}
.hang::after{content:'';position:absolute;left:50%;top:100%;width:var(--d);height:var(--d);margin-left:calc(var(--d)/-2);border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#fff0 13%),conic-gradient(from 20deg,#ff9ad0,#ffe38a,#9fd8ff,#c9a6ff,#b5f0c4,#ff9ad0,#ffe38a,#9fd8ff,#ff9ad0);box-shadow:0 0 8px #fff9,inset 0 0 0 2px #fff8;animation:holo 3s linear infinite}
@keyframes swing{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}@keyframes holo{to{filter:hue-rotate(360deg)}}
/* new decorations */
.cube{width:92px;height:80px;margin-top:14px;border-radius:10px;background:linear-gradient(145deg,#8f7cff,#4b3bb5);box-shadow:0 3px 0 #2f2480,inset 0 0 0 3px #ffffff40}
.cube b{position:absolute;left:30px;top:-14px;width:32px;height:16px;border-radius:9px 9px 0 0;border:4px solid #4b3bb5;border-bottom:0}
.cube i{position:absolute;border-radius:50%}.cube i:nth-of-type(1){left:26px;top:22px;width:40px;height:40px;background:#2f2480;box-shadow:inset 0 0 0 5px #6d5ce0}
.cube i:nth-of-type(2){left:8px;top:8px;width:10px;height:10px;background:#9bff9b}.cube i:nth-of-type(3){right:8px;top:8px;width:10px;height:10px;background:#fff}
.skate{width:40px;height:130px;margin-bottom:4px;transform:rotate(8deg);transform-origin:50% 100%}
.skate b{position:absolute;inset:0;border-radius:20px;background:linear-gradient(#ff9a3c,#ff5a1f 55%,#222);box-shadow:0 3px 0 #0006,inset 0 0 0 3px #fff3}
.skate i{position:absolute;left:8px;top:30px;width:24px;height:6px;background:#fff;opacity:.85;border-radius:3px}.skate i:nth-of-type(2){top:46px;width:14px}
/* teen boy bedroom */
.bp{display:none;position:absolute;width:92px;height:123px;object-fit:cover;border:4px solid #fff;background:#fff;cursor:pointer;box-shadow:2px 3px 0 #0002}
#room.boy .bp{display:block}#room.boy img.pos{display:none}
#room.boy{background:radial-gradient(circle at 25% 10%,#6aa0e055,#0000 50%),repeating-linear-gradient(90deg,#1c3556 0 38px,#183050 38px 40px)}
#room.boy .st{color:#bfe3ff;text-shadow:0 0 6px #4aa3ff}
#room.boy .top button{background:linear-gradient(#e3f1ff,#4aa3ff)}
#room.boy .win{background:radial-gradient(circle at 72% 28%,#fff 0 7px,#fff0 8px),linear-gradient(#0b1b3a,#27407a);box-shadow:0 0 0 2px #4aa3ff}
#room.boy .tv{background:#9fb8d9;box-shadow:0 4px 0 #5a7fb0}
#room.boy .board{background:linear-gradient(#a37a52,#6b4a2c);box-shadow:0 4px 0 #3e2a18}
#room.boy .cab{background:#2a3f63;box-shadow:inset 0 0 0 3px #4a6a9a}
#room.boy .dr{background:#3a557f;border-color:#6aa0e0}#room.boy .dr.open{background:#4a6a9a;box-shadow:0 10px 0 #1e3f85}#room.boy .nm{color:#e8f3ff}
#room.boy .pg{border-left-color:#4aa3ff;background:#eef5ff;box-shadow:0 5px 0 #2b4f8a}#room.boy .pn{color:#e8f3ff}
#room.boy .lamp .g{background:linear-gradient(#5be3ff,#3b6fd0)}
#room.boy .dm.portable{background:radial-gradient(circle at 30% 22%,#ffffff40,#fff0 42%),#6082B6;box-shadow:0 8px 0 #3d5a80,inset 0 0 0 4px #ffffff80}
#room.boy .dm.portable::before{display:none}
#room.boy .dm.portable .lcd{background:#a8bedb}
#room.boy .dm.portable .row button{background:linear-gradient(#fff,#c3d3e8);box-shadow:0 2px 0 #3d5a80}
#room:not(.boy) .dm.classic{background:linear-gradient(145deg,#e6d2ff,#CF9FFF 55%,#b98be6);box-shadow:0 6px 0 #9a6fc9,inset 0 0 0 3px #fff}
.note{position:absolute;font-size:22px;pointer-events:none;z-index:7;text-shadow:0 0 4px #fff}
.fly{position:fixed;left:0;top:0;z-index:50;pointer-events:none}
/* spindle */
.spindle{position:absolute;left:50px;bottom:140px;width:220px;height:270px}
.pole{position:absolute;left:105px;bottom:4px;width:10px;height:200px;border-radius:5px;background:linear-gradient(90deg,#9aa,#fff,#9aa);z-index:0}
.stack{position:absolute;left:0;bottom:4px;width:220px;z-index:1;display:flex;flex-direction:column-reverse}
.sd{height:26px;margin-top:-14px;border-radius:50%;background:linear-gradient(var(--c),#fff9 45%,var(--c));box-shadow:0 2px 0 #0003;cursor:pointer;position:relative;transition:transform .2s}
.sd:last-child:hover{transform:translateY(-5px);filter:drop-shadow(0 0 8px #fff)}
.arrows{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between}
.arrows button{font-size:22px;border:0;background:none;cursor:pointer}
.lbl{position:absolute;bottom:-2px;width:100%;text-align:center;font-size:13px;display:none}
/* discman */
.dm{position:absolute;left:330px;bottom:140px;width:340px;height:350px;padding:16px;border-radius:44px 44px 30px 30px;
 background:linear-gradient(145deg,#f4f8ff,#b9c9e6 55%,#8fa4cc);box-shadow:0 6px 0 #6f84ad,inset 0 0 0 3px #fff;perspective:700px}
/* skin: round translucent portable */
.dm.portable{width:340px;height:340px;padding:0;border-radius:50%;background:radial-gradient(circle at 30% 22%,#fffc,#fff0 42%),radial-gradient(circle,#ffd9ea,#ff9ac8);box-shadow:0 8px 0 #d77fae,inset 0 0 0 4px #fffb,inset 0 0 40px #fff9}
.dm.portable::before{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;opacity:.6;background:radial-gradient(#fff 1px,transparent 1.6px) 0 0/13px 13px,radial-gradient(#fff 1px,transparent 1.6px) 6px 7px/13px 13px}
.dm.portable .lid{transform-style:preserve-3d}
.dm.portable .well{position:absolute;left:54px;top:54px;width:232px;height:232px;margin:0}
.dm.portable .lcd{position:absolute;left:61px;top:61px;width:118px;height:118px;margin:0;backface-visibility:hidden;border-radius:50%;background:#f7b9d3;display:grid;place-items:center;z-index:3;box-shadow:0 0 0 3px #fff8,inset 0 0 8px #0003}
.dm.portable .scr{width:98px;height:58px;padding:1px 6px}
.dm.portable #l1{font-size:25px;line-height:28px}.dm.portable #l2{font-size:16px;gap:6px}
.dm.portable .row{display:contents}
.dm.portable .row button{position:absolute;left:153px;top:153px;width:34px;height:34px;padding:0;border-radius:50%;font-size:9px;z-index:5;box-shadow:0 2px 0 #d7609b;background:linear-gradient(#fff,#ffb3d6)}
.dm.portable .r1 button{font-size:14px}
.dm.classic{width:340px;height:392px;padding:16px;border-radius:44px 44px 30px 30px}
.dm.classic .well{width:176px;height:176px}
.dm.classic .lcd{margin:8px 0}
.dm.classic .r2{flex-wrap:wrap;gap:6px}
.dm.shake{animation:sh .12s}
@keyframes sh{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.well{position:relative;width:176px;height:176px;margin:0 auto;border-radius:50%;background:#2b2f4a;display:grid;place-items:center;box-shadow:inset 0 0 14px #000}
.tray{display:grid;place-items:center}
.tray .cd.spin{animation:rot 1.2s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.laser{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#f33;box-shadow:0 0 8px 3px #f55;opacity:0;z-index:3}
.laser.on{opacity:1;animation:ls 4s ease-in-out infinite alternate}
@keyframes ls{from{transform:translateX(14px)}to{transform:translateX(70px)}}
.lid{position:absolute;inset:-4px;border-radius:50%;z-index:4;background:linear-gradient(135deg,#ffffffcc,#ffffff30);border:3px solid #fff9;transform-origin:50% 0;transition:transform .45s}
.dm.open .lid{transform:rotateX(-115deg);pointer-events:none}.dm.open .tray .cd{cursor:pointer}
.scr{height:56px;padding:2px 8px;background:#b9cba2;border-radius:8px;box-shadow:inset 0 2px 6px #0006;font-family:'VT323',monospace;color:#25361a;overflow:hidden}.lcd{margin:6px 24px}
#l1{font-size:30px;line-height:34px;white-space:nowrap;overflow:hidden}
#l1 span{display:inline-block}#l1 .sc{animation:mq 9s linear infinite;padding-left:100%}
@keyframes mq{to{transform:translateX(-100%)}}
#l2{font-size:20px;display:flex;gap:12px;opacity:.85}
.row{display:flex;justify-content:center;gap:10px;margin-top:6px}
.row button{border:0;cursor:pointer;color:var(--ink);font:inherit;box-shadow:0 3px 0 #6f84ad;transition:transform .08s}
.row button:active{transform:translateY(3px);box-shadow:none;filter:brightness(.85)}
.r1 button{width:50px;height:38px;border-radius:99px;background:linear-gradient(#fff,#ffb3d6);font-size:18px}
.r2 button{padding:2px 9px;border-radius:99px;background:linear-gradient(#fff,#d6e4ff);font-size:13px}
.r2 button.on{background:linear-gradient(#fff,#ff9ad0)}
/* decor */
.lamp{position:relative;width:70px;height:210px}
.lamp .g{position:absolute;top:0;left:0;right:0;bottom:30px;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%);background:linear-gradient(#ff9ad0,#c9a6ff);overflow:hidden}
.lamp .g i{position:absolute;left:30%;width:26px;height:26px;border-radius:50%;background:#ffe38a;animation:lv 7s ease-in-out infinite alternate;bottom:0}
.lamp .g i:nth-child(2){left:45%;width:18px;height:18px;animation-duration:5s;animation-delay:-2s}
.lamp .g i:nth-child(3){left:20%;width:22px;height:22px;animation-duration:9s;animation-delay:-4s}
@keyframes lv{to{transform:translateY(-140px) scale(1.3)}}
.lamp .base{position:absolute;bottom:0;left:-4px;right:-4px;height:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(#e6e6f5,#9aa)}
.heart{position:relative;width:84px;height:84px;font-size:84px;line-height:1;color:var(--hot);text-shadow:inset 0 0 0 #fff,0 0 14px #ffb3d6;filter:drop-shadow(0 6px 0 #d7609b)}
.deco{position:absolute;bottom:140px;font-size:46px}
/* modal */
#modal{position:fixed;inset:0;background:#5a2a4955;display:none;place-items:center;z-index:60}
#modal.on{display:grid}
.card{background:#fff5fa;border:4px solid #fff;outline:3px solid #ff9ad0;border-radius:24px;padding:20px 24px;max-width:360px;width:90%;text-align:center;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.card h2{margin:0;font-size:22px}.card p{margin:0;text-align:left}
.card input{width:100%;padding:8px 12px;border-radius:99px;border:2px solid #ff9ad0;font:inherit}
.card button{font:inherit;padding:5px 18px;border-radius:99px;border:2px solid #fff;background:linear-gradient(#ffe3f1,#ff9ad0);color:var(--ink);cursor:pointer}
.cd u{position:absolute;inset:0;border-radius:50%;opacity:.5}.cd u.dots{background:radial-gradient(var(--ink) 1.5px,transparent 2px) 0 0/16% 16%}.cd u.stripes{background:repeating-linear-gradient(45deg,var(--ink) 0 2px,transparent 2px 10px)}.cd u.rings{background:repeating-radial-gradient(circle,var(--ink) 0 1.5px,transparent 1.5px 10px)}
.book{position:absolute;left:34px;bottom:140px;width:250px;display:none;flex-direction:column;align-items:center;gap:6px}.book.on{display:flex}
.pg{width:232px;height:212px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-radius:6px 14px 14px 6px;background:#fff5fa;border-left:12px solid #ff7ab8;box-shadow:0 5px 0 #d77fae}
.pk{display:grid;place-items:center;border-radius:6px;background:linear-gradient(135deg,#ffffffb0,#d6e4ff80);border:2px solid #fff;cursor:pointer}
.pn{display:flex;gap:10px;align-items:center;font-size:14px}.pn button{border:0;background:none;font-size:22px;cursor:pointer}
.card label{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;font-size:15px}.card label input,.card select{width:60%}.card input[type=color]{width:60px;height:30px;padding:0}.card input[type=checkbox]{width:auto}
.sp{position:fixed;z-index:70;pointer-events:none;font-size:20px}
@media (prefers-reduced-motion:reduce){.st,.lamp i{animation:none}}
</style>
</head>
<body>
<div id="pan"><div id="room">
  <div class="top"><button data-m="how">❔ How to use</button><button data-m="yt">▶ Add YouTube</button><button data-a="skin" id="bskin">Switch: Classic</button><button data-a="room" id="broom">Room: Girl</button></div>
  <div class="win"></div>
  <img class="pos" src="posters/shakira.jpg" alt="Poster" style="left:335px;top:40px;transform:rotate(-4deg)" onclick="showPoster(this.src)">
  <img class="pos" src="posters/nsync.jpg" alt="Poster" style="left:450px;top:42px;transform:rotate(3deg)" onclick="showPoster(this.src)">
  <img class="bp" src="posters/linkin.jpg" alt="Poster" style="left:335px;top:40px;transform:rotate(-4deg);object-position:top" onclick="showPoster(this.src)">
  <img class="bp" src="posters/skate.jpg" alt="Poster" style="left:450px;top:42px;transform:rotate(3deg)" onclick="showPoster(this.src)">
  <div class="hang" style="left:578px;--l:62px;--d:42px;animation-delay:-1s"></div><div class="hang" style="left:628px;--l:96px;--d:38px;animation-delay:-2.3s"></div><div class="hang" style="left:684px;--l:74px;--d:44px;animation-delay:-.4s"></div>
  <div class="tv">pocket tv<div id="ytw"><div id="yt"></div></div></div>

  <div class="spindle" id="spin"><div class="arrows"><button data-a="sl" aria-label="Previous CD">⏪</button><button data-a="sr" aria-label="Next CD">⏩</button></div><div class="pole"></div><div class="stack" id="stack"></div></div>
  <div class="book" id="book"><div class="pg" id="pg"></div><div class="pn"><button data-a="bl" aria-label="Previous page">◀</button><span id="pn"></span><button data-a="br" aria-label="Next page">▶</button></div></div>

  <div class="dm portable" id="dm">
    <div class="well"><div class="tray" id="tray"></div><div class="laser" id="laser"></div><div class="lid"></div></div>
    <div class="lcd"><div class="scr"><div id="l1"></div><div id="l2"></div></div></div>
    <div class="row r1"><button data-a="prev" aria-label="Previous track">⏮</button><button data-a="play" aria-label="Play or pause">⏯</button><button data-a="stop" aria-label="Stop">⏹</button><button data-a="next" aria-label="Next track">⏭</button></div>
    <div class="row r2"><button data-a="disp">DISP</button><button data-a="rep" id="brep">REP</button><button data-a="shuf" id="bshuf">SHUF</button><button data-a="vm">VOL−</button><button data-a="vp">VOL+</button><button data-a="open">OPEN</button><button data-a="intro" id="bintro">INTRO</button><button data-a="prog" id="bprog">PROG</button></div>
  </div>

  <svg id="hp" viewBox="0 0 130 180" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><defs><g id="eb"><rect x="-2" y="2" width="4" height="13" rx="2" fill="#fff"/><ellipse rx="6.5" ry="5.5" fill="#fff"/><circle cy="-.5" r="2.2" fill="#d9d0d6" stroke="none"/></g></defs>
<g stroke="#bda9b6" stroke-width="4"><path d="M28,10 C46,10 52,30 50,56 C48,90 36,120 54,140 C70,158 112,162 108,138"/></g><g stroke="#fff" stroke-width="2.4"><path d="M28,10 C46,10 52,30 50,56 C48,90 36,120 54,140 C70,158 112,162 108,138"/></g>
<g stroke="#bda9b6" stroke-width="4"><path d="M108,138 C104,116 66,116 56,134 C50,148 52,170 76,174 L80,172"/><path d="M80,172 C62,180 44,176 30,168"/><path d="M80,172 C90,177 98,176 106,171"/></g><g stroke="#fff" stroke-width="2.4"><path d="M108,138 C104,116 66,116 56,134 C50,148 52,170 76,174 L80,172"/><path d="M80,172 C62,180 44,176 30,168"/><path d="M80,172 C90,177 98,176 106,171"/></g>
<rect x="22" y="5" width="9" height="10" rx="2.5" fill="#fff" stroke="#bda9b6" stroke-width="1.2"/><circle cx="80" cy="172" r="2.4" fill="#fff" stroke="#bda9b6" stroke-width="1.2"/>
<g stroke="#bda9b6" stroke-width="1.2"><use href="#eb" transform="translate(15,168) rotate(-90)"/><use href="#eb" transform="translate(121,171) rotate(90)"/></g></svg>
  <div class="slot" style="left:770px;width:200px"></div>
  <div class="board"></div>
  <div class="cab"><div class="dr" id="d2"><button class="nm" data-a="dr2">CDs</button><div class="in"><span style="font-size:30px">📖</span><button class="nm" data-a="swap" id="bswap">Swap: spindle</button></div></div><div class="dr" id="d3"><button class="nm" data-a="dr3">decor</button><div class="in" id="dcs"></div></div><div class="dr" id="d1"><button class="nm" data-a="dr1">stickers</button><div class="in" id="stk"></div></div></div>
</div></div>
<div id="modal"></div><div id="rot">Turn your iPad sideways 🔄</div>

<script>
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL=['#ff9ad0','#9fd8ff','#c9a6ff','#b5f0c4','#ffe38a','#ffb48a'];
const mk=(id,name,n,i,src)=>({id,name,count:n,color:COL[i%6],src,cover:null,tracks:Array.from({length:n},(_,k)=>({id:'',title:'Track '+(k+1),artist:'Demo Artist'}))});
let cds=[['Summer 2002 Mix',12],['Road Trip',9],['Sleepover Jams',15],['Chill Vibes',8],['Dance Dance',11]].map((d,i)=>mk('d'+i,d[0],d[1],i,'sim'));
let loaded=null,busy=false,yt=null,msg='',P={lock:0,intro:false,prog:false,pos:0,order:[],rep:0,shuf:false,vol:80,view:0,t:0,d:180,playing:false,started:false};

/* stars */
for(let i=0;i<34;i++){const s=document.createElement('span');s.className='st';s.textContent='✦';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*92}%;font-size:${8+Math.random()*12}px;animation-delay:${-Math.random()*3}s`;$('#room').append(s)}

/* sound (synthesized) */
let ac=null,mo=null;
function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();return ac}
function blip(f,d,ty='square',g=.06,at=0){try{const a=A(),o=a.createOscillator(),v=a.createGain();o.type=ty;o.frequency.value=f;v.gain.setValueAtTime(g,a.currentTime+at);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+d);o.connect(v).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+d)}catch(e){}}
const sfx={btn:()=>blip(900,.04),chk:()=>blip(160,.06),clack:()=>{blip(300,.04);blip(120,.08,'square',.07,.06)}};
function motor(){}

/* cd drawing */
let K=1,DS=220,left='book',pg=0,cust={},hidden=[];try{hidden=JSON.parse(localStorage.getItem('pd.hide')||'[]')}catch(e){}try{cust=JSON.parse(localStorage.getItem('pd.cust')||'{}')}catch(e){}
const applyCust=()=>cds.forEach(c=>{const v=cust[c.id];if(v)Object.assign(c,v)});
const saveCust=c=>{cust[c.id]={color:c.color,ink:c.ink,home:!!c.home,doodle:c.doodle,label:c.label};try{localStorage.setItem('pd.cust',JSON.stringify(cust))}catch(e){}};
const mins=c=>c.dur?' · '+Math.round(c.dur/60)+' min':'';
let U=0;
function arcText(name,cnt){const id='t'+(U++);let l1='',l2='';
 name.split(' ').forEach(w=>{if(!l2&&(l1+' '+w).trim().length<=20)l1=(l1+' '+w).trim();else l2=(l2+' '+w).trim()});
 if(!l1){l1=name.slice(0,20);l2=name.slice(20)}
 const cut=(t,n)=>t.length>n?t.slice(0,n-1)+'…':t,tp=(i,t)=>`<text><textPath href="#${id}${i}" startOffset="50%" text-anchor="middle">${esc(t)}</textPath></text>`;
 return `<svg viewBox="0 0 100 100"><defs><path id="${id}a" d="M12,50 A38,38 0 0 1 88,50"/><path id="${id}b" d="M21,50 A29,29 0 0 1 79,50"/><path id="${id}c" d="M16,50 A34,34 0 0 0 84,50"/></defs>${tp('a',cut(l1,22))}${l2?tp('b',cut(l2,18)):''}${tp('c',cnt)}</svg>`}
function disc(cd,sz){const d=document.createElement('div'),img=cd.cover,h=!img||cd.home;d.className='cd'+(h?' home':'');d.style.setProperty('--s',sz+'px');d.style.setProperty('--c',cd.color);d.style.setProperty('--ink',cd.ink||'#222222');
 if(!h)d.style.backgroundImage=`url(${img})`;else d.innerHTML=`<u class="${cd.doodle||''}"></u>${arcText(cd.label||cd.name,cd.count+' songs'+mins(cd))}`;return d}
const visible=()=>cds.filter(c=>!c.out);
function drawStack(){const st=$('#stack');st.innerHTML='';visible().slice(0,7).reverse().forEach((c,i,a)=>{const e=document.createElement('div');e.className='sd';e.dataset.id=c.id;e.style.setProperty('--c',c.color);e.title=c.name;if(c.ghost)e.style.visibility='hidden';if(i===a.length-1)e.onclick=()=>preview(c);st.append(e)})}
function drawBook(){const g=$('#pg');g.innerHTML='';const v=visible(),n=Math.max(1,Math.ceil(v.length/4));pg=Math.min(pg,n-1);
 v.slice(pg*4,pg*4+4).forEach(c=>{const p=document.createElement('div');p.className='pk';p.dataset.id=c.id;p.onclick=()=>preview(c);const d=disc(c,76);if(c.ghost)d.style.visibility='hidden';p.append(d);g.append(p)});$('#pn').textContent=(pg+1)+' / '+n}
const renderStack=()=>{$('#spin').style.display=left==='spindle'?'':'none';$('#book').classList.toggle('on',left==='book');drawStack();drawBook()};
function renderTray(){const t=$('#tray');t.innerHTML='';if(loaded){const d=disc(loaded,DS);d.classList.toggle('spin',P.playing);t.append(d)}}
const rectOf=cd=>{const e=document.querySelector({book:'.pk',spindle:'.sd'}[left]+`[data-id="${cd.id}"]`);return(e||$('#spin')).getBoundingClientRect()};

/* fly a disc: rises out of its place, glides, drops into the next (s0/s1 = flatness at start/end) */
async function fly(cd,a,b,s0,s1){const z=DS*K,f=disc(cd,z);f.classList.add('fly');document.body.append(f);
 const p=(r,y,s)=>`translate(${r.left+r.width/2-z/2}px,${r.top+r.height/2-z/2+y*K}px) scale(1,${s})`;
 await f.animate([{transform:p(a,0,s0)},{transform:p(a,-110,1),offset:.3},{transform:p(b,-110,1),offset:.7},{transform:p(b,0,s1)}],{duration:1000,easing:'ease-in-out',fill:'forwards'}).finished;f.remove()}

async function insert(cd){if(busy)return;busy=true;closeM();
 if(loaded)await eject(true);
 sfx.clack();$('#dm').classList.add('open');await wait(450);
 const from=rectOf(cd),s0=left==='spindle'?.16:1;cd.out=true;renderStack();
 await fly(cd,from,$('#tray').getBoundingClientRect(),s0,1);
 loaded=cd;P.started=false;P.t=0;buildOrder(0);renderTray();sfx.chk();await wait(250);
 $('#dm').classList.remove('open');sfx.clack();await wait(450);busy=false;play()}
async function eject(keep){if(!loaded)return;const cd=loaded;stop();sfx.clack();$('#dm').classList.add('open');await wait(450);
 const a=$('#tray').getBoundingClientRect();loaded=null;renderTray();
 cd.out=false;cd.ghost=true;renderStack();const b=rectOf(cd);
 await fly(cd,a,b,1,left==='spindle'?.16:1);cd.ghost=false;renderStack();render();
 if(!keep){await wait(150);$('#dm').classList.remove('open');sfx.clack()}}

/* playback */
const trk=()=>loaded&&loaded.tracks[P.order[P.pos]];
function buildOrder(cur){P.prog=false;const n=loaded.tracks.length;let o=[...Array(n).keys()];
 if(P.shuf){for(let i=n-1;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}o=[cur,...o.filter(x=>x!==cur)];P.pos=0}else P.pos=cur;P.order=o}
const isYT=()=>loaded&&loaded.src==='yt'&&yt&&yt.loadVideoById;
function startTrack(){const t=trk();P.t=0;P.d=(t&&t.dur)||180;P.started=true;P.lock=Date.now();
 if(isYT()&&t&&t.id){yt.loadVideoById(t.id);yt.setVolume(P.vol)}}
function play(){if(!loaded){flash('NO DISC');return}if($('#dm').classList.contains('open')){flash('LID OPEN');return}if(!P.started)startTrack();else if(isYT())yt.playVideo();P.playing=true;motor(true);render()}
function pause(){P.playing=false;if(isYT())yt.pauseVideo();motor(false);render()}
function stop(){P.playing=false;P.started=false;P.t=0;if(isYT())yt.stopVideo();motor(false);render()}
function go(d,auto){if(!loaded)return;const n=P.order.length;let p=P.pos+d;
 if(p>=n){if(auto&&P.rep!==2){stop();return}p=0}if(p<0)p=n-1;P.pos=p;startTrack();P.playing=true;motor(true);render()}
function ended(){if(P.rep===1){startTrack();return}go(1,true)}
setInterval(()=>{if(!loaded||!P.playing)return;
 if(Date.now()-P.lock<1200){render();return}
 if(isYT()&&yt.getCurrentTime&&trk().id){P.t=yt.getCurrentTime()||0;P.d=yt.getDuration()||180}
 else{P.t+=.25;if(P.t>=P.d)ended()}
 if(P.intro&&P.t>=10&&Date.now()-P.lock>1200)ended();render()},250);

/* lcd */
function flash(t){msg=t;render();setTimeout(()=>{msg='';render()},1400)}
const f2=n=>String(n).padStart(2,'0'),fmt=s=>{s=Math.max(0,Math.floor(s||0));return f2(Math.floor(s/60))+':'+f2(s%60)};
function render(){const t=trk();let a=!loaded?'NO DISC':[t&&t.artist,t&&t.title,fmt(P.t),'-'+fmt(P.d-P.t),'TRACK '+f2(P.pos+1)+'/'+f2(P.order.length),'VOL '+f2(Math.round(P.vol/10))][P.view];
 a=(msg||a||'').toUpperCase();const l=$('#l1');if(l.dataset.v!==a){l.dataset.v=a;l.innerHTML=`<span class="${a.length>($('#dm').classList.contains('portable')?8:13)?'sc':''}">${esc(a)}</span>`}
 $('#l2').innerHTML=`<span>${P.playing?'▶':loaded&&P.started?'❚❚':'■'}</span><span>${['','R1','RA'][P.rep]}</span><span>${P.shuf?'SH':''}</span><span>${P.intro?'IN':''}</span><span>${P.prog?'PG':''}</span>`;
 $('#brep').classList.toggle('on',P.rep>0);$('#bshuf').classList.toggle('on',P.shuf);$('#bintro').classList.toggle('on',P.intro);$('#bprog').classList.toggle('on',P.prog);
 const d=$('#tray .cd');if(d)d.classList.toggle('spin',P.playing);$('#laser').classList.toggle('on',P.playing)}

/* buttons */
document.addEventListener('click',e=>{
 const s=document.createElement('span');s.className='sp';s.textContent='✨';s.style.left=e.clientX-10+'px';s.style.top=e.clientY-10+'px';document.body.append(s);
 s.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(-30px) scale(1.6)'}],600).finished.then(()=>s.remove());
 const b=e.target.closest('[data-a]');if(b){sfx.btn();navigator.vibrate&&navigator.vibrate(15);const dm=$('#dm');dm.classList.remove('shake');void dm.offsetWidth;dm.classList.add('shake');act(b.dataset.a)}
 const m=e.target.closest('[data-m]');if(m)openM(m.dataset.m);
 if(e.target.id==='modal'||e.target.closest('[data-x]'))closeM();
 if(e.target.closest('#tray .cd')&&$('#dm').classList.contains('open')&&!busy){busy=true;eject(true).then(()=>busy=false)}});
function act(a){switch(a){
 case 'sl':cds.push(cds.shift());renderStack();break;
 case 'sr':cds.unshift(cds.pop());renderStack();break;
 case 'play':P.playing?pause():play();break;
 case 'stop':stop();break;
 case 'next':go(1);break;
 case 'prev':P.t>3?startTrack():go(-1);break;
 case 'disp':P.view=(P.view+1)%6;break;
 case 'rep':P.rep=(P.rep+1)%3;break;
 case 'shuf':P.shuf=!P.shuf;if(loaded)buildOrder(P.order[P.pos]||0);break;
 case 'vm':case 'vp':P.vol=Math.min(100,Math.max(0,P.vol+(a==='vp'?10:-10)));if(yt&&yt.setVolume)yt.setVolume(P.vol);P.view=5;clearTimeout(act.vt);act.vt=setTimeout(()=>{P.view=0;render()},1800);break;
 case 'open':{const d=$('#dm');if(!d.classList.contains('open')&&P.playing)pause();d.classList.toggle('open');sfx.clack();break}
 case 'bl':case 'br':pg=Math.max(0,pg+(a==='br'?1:-1));renderStack();$('#pg').animate([{transform:'rotateY(-60deg)',opacity:.3},{transform:'none',opacity:1}],250);break
 case 'dr1':$('#d1').classList.toggle('open');break
 case 'dr2':$('#d2').classList.toggle('open');break
 case 'dr3':$('#d3').classList.toggle('open');break
 case 'swap':{const nx={spindle:'book',book:'spindle'},nm={spindle:'spindle',book:'CD book'};left=nx[left];$('#bswap').textContent='Swap: '+nm[nx[left]];renderStack();break}
 case 'room':setRoom(room==='girl'?'boy':'girl');break
 case 'skin':setSkin($('#dm').classList.contains('portable')?'classic':'portable');break
 case 'intro':P.intro=!P.intro;break
 case 'prog':progUI();break}
 render()}

function showPoster(u){modal(`<img src="${u}" alt="Poster" style="max-width:100%;max-height:68vh;border-radius:10px"><button data-x>Close</button>`)}
/* modals */
const modal=h=>{const M=$('#modal');M.innerHTML='<div class="card">'+h+'</div>';M.classList.add('on')},closeM=()=>$('#modal').classList.remove('on');
function preview(cd){modal(`<h2>${esc(cd.label||cd.name)}</h2><div id="pv"></div><p>${cd.count+' songs'+mins(cd)}</p><div><button id="ins">Insert</button> <button id="cu">Customize</button> <button id="rm">Remove</button> <button data-x>✕</button></div>`);
 $('#pv').append(disc(cd,200));$('#ins').onclick=()=>insert(cd);$('#cu').onclick=()=>custom(cd);
 $('#rm').onclick=e=>{const b=e.target;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Sure? Tap again';return}removeCD(cd)}}
function removeCD(cd){if(loaded===cd){stop();loaded=null;renderTray();render()}cds=cds.filter(c=>c!==cd);if(!hidden.includes(cd.id))hidden.push(cd.id);try{localStorage.setItem('pd.hide',JSON.stringify(hidden))}catch(e){}renderStack();closeM()}
function custom(cd){modal(`<h2>Customize CD</h2><div id="pv"></div>
 <label>Name <input id="cn" value="${esc(cd.label||cd.name)}"></label>
 <label>Disc <input type="color" id="cc" value="${cd.color}"></label>
 <label>Sharpie <input type="color" id="ci" value="${cd.ink||'#222222'}"></label>
 <label>Design <select id="cs"><option value="">plain</option><option>dots</option><option>stripes</option><option>rings</option></select></label>
 ${cd.cover?'<label>Homemade look <input type="checkbox" id="ch"></label>':''}<button id="ok">Done</button>`);
 $('#cs').value=cd.doodle||'';if(cd.cover)$('#ch').checked=!!cd.home;
 const up=()=>{cd.label=$('#cn').value;cd.color=$('#cc').value;cd.ink=$('#ci').value;cd.doodle=$('#cs').value;if(cd.cover)cd.home=$('#ch').checked;$('#pv').innerHTML='';$('#pv').append(disc(cd,200))};
 ['cn','cc','ci','cs','ch'].forEach(i=>{const e=$('#'+i);if(e)e.addEventListener('input',up)});up();
 $('#ok').onclick=()=>{saveCust(cd);renderStack();renderTray();preview(cd)}}
function modal2(k){return({
 how:`<h2>How to use</h2><p>1. Tap Add YouTube and paste a channel @handle or a playlist link. Every public playlist becomes a CD.<br>2. Tap a CD (top of the spindle, or in the book), then Insert. Customize changes its colors and sharpie.<br>3. Drawers: stickers go anywhere (drag one back onto the drawers to put it away). The CD book can replace the spindle.<br>4. OPEN lifts the lid. Tap the disc to take it out.</p><button data-x>Got it</button>`,
 yt:`<h2>Add YouTube</h2><input id="q" placeholder="paste a playlist or @channel link"><button id="go">Make CDs</button><p id="st"></p>${hidden.length?'<button id="rs">Bring back removed CDs ('+hidden.length+')</button>':''}<button data-x>Close</button>`})[k]}
function openM(k){modal(modal2(k));if(k==='yt'){$('#go').onclick=()=>addSrc(k,$('#q').value);const r=$('#rs');if(r)r.onclick=()=>{hidden=[];try{localStorage.removeItem('pd.hide')}catch(e){}location.reload()}}}

/* Program mode: tap songs in the order you want */
function progUI(){if(!loaded){flash('NO DISC');return}let seq=P.prog?[...P.order]:[];
 const draw=()=>{modal(`<h2>Program</h2><p>Tap songs in the order you want.</p><div style="max-height:220px;overflow:auto;width:100%;text-align:left">${loaded.tracks.map((t,i)=>{const n=seq.indexOf(i);return `<div data-t="${i}" style="padding:3px 6px;cursor:pointer;${n>=0?'background:#ffd6ea;border-radius:8px':''}">${n>=0?(n+1)+'. ':'• '}${esc(t.title)}</div>`}).join('')}</div><div><button id="pc">Clear</button> <button id="pgo">Play</button> <button data-x>✕</button></div>`);
  document.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{const i=+e.dataset.t,n=seq.indexOf(i);n>=0?seq.splice(n,1):seq.push(i);draw()});
  $('#pc').onclick=()=>{seq=[];if(P.prog)buildOrder(P.order[P.pos]||0);draw()};
  $('#pgo').onclick=()=>{if(!seq.length)return;P.order=seq;P.pos=0;P.prog=true;P.shuf=false;closeM();startTrack();P.playing=true;motor(true);render()}};draw()}

/* skins */
const ANG={play:0,next:30,rep:60,shuf:90,intro:120,vp:150,open:180,vm:210,prog:240,disp:270,stop:300,prev:330};
function setSkin(k){$('#dm').classList.remove('portable','classic');$('#dm').classList.add(k);DS=k==='portable'?220:160;{const l=$('.lcd');if(k==='portable')$('.lid').append(l);else $('.well').after(l)}
 document.querySelectorAll('.dm [data-a]').forEach(b=>{const a=ANG[b.dataset.a];b.style.transform=k==='portable'?`rotate(${a}deg) translateY(-140px) rotate(${-a}deg)`:''});
 $('#bskin').textContent='Switch: '+(k==='portable'?'Classic':'Round');renderTray();render();try{localStorage.setItem('pd.skin',k)}catch(e){}}

/* sources: YouTube */
async function addSrc(k,q,quiet){const st=$('#st');if(!quiet&&st)st.textContent='Loading…';
 try{const r=await fetch('/api/youtube'+'?q='+encodeURIComponent(q));let j;try{j=await r.json()}catch(e){throw new Error(r.status===404?'the helper file api/youtube.js was not found on your site':'the server sent an unexpected answer (code '+r.status+')')}if(!r.ok)throw new Error(j.error);
  const have=new Set(cds.map(c=>c.id));
  const n=j.cds.filter(c=>!have.has(c.id)&&!hidden.includes(c.id)).map((c,i)=>({...c,src:k,color:COL[(cds.length+i)%6]}));
  if(n.length)cds=n.concat(cds.filter(c=>c.src!=='sim'||c===loaded));
  applyCust();renderStack();if(!quiet){save(k+'|'+q);closeM()}}
 catch(e){if(!quiet&&st)st.textContent='Could not load: '+e.message}}
function save(q){try{const s=JSON.parse(localStorage.getItem('pd.src')||'[]');if(!s.includes(q))s.push(q);localStorage.setItem('pd.src',JSON.stringify(s))}catch(e){}}
try{JSON.parse(localStorage.getItem('pd.src')||'[]').forEach(x=>{const m=x.match(/^(yt|sp)\|(.*)$/);if(m&&m[1]==='sp')return;addSrc('yt',m?m[2]:x,true)})}catch(e){}

/* YouTube player */
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.append(tag);
window.onYouTubeIframeAPIReady=()=>{yt=new YT.Player('yt',{width:200,height:200,playerVars:{playsinline:1,controls:0},events:{onStateChange:e=>{if(e.data===0)ended();if(e.data===1)P.skips=0},onError:()=>{if(!isYT()||!P.playing)return;P.skips=(P.skips||0)+1;if(P.skips>loaded.tracks.length){stop();flash('NO PLAY');return}flash('SKIPPED');go(1,true)}}})};
/* stickers */
function place(sv,ev){const n=document.createElement('span');n.className='placed';n.textContent=sv;$('#room').append(n);n.onpointerdown=e=>{e.preventDefault();dragN(n)};dragN(n,ev)}
function dragN(n,ev){const r=$('#room').getBoundingClientRect();
 const mv=e=>{n.style.left=(e.clientX-r.left)/K-13+'px';n.style.top=(e.clientY-r.top)/K-13+'px'};
 const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);const c=$('.cab').getBoundingClientRect(),b=n.getBoundingClientRect(),y=b.top+b.height/2;if(y>c.top)n.remove()};
 addEventListener('pointermove',mv);addEventListener('pointerup',up);if(ev)mv(ev)}
const STK={girl:['⭐','💖','🦋','🐬','🌸','✨','🦄','💿'],boy:['⚡','🛹','🎸','💀','🔥','🎮','👾','💿']};
function buildStk(){$('#stk').innerHTML='';STK[room].forEach(sv=>{const e=document.createElement('span');e.className='stk';e.textContent=sv;e.onpointerdown=ev=>{ev.preventDefault();place(sv,ev)};$('#stk').append(e)})}
function setRoom(r){room=r;$('#room').classList.toggle('boy',r==='boy');document.body.style.background=r==='boy'?'#10233b':'';$('#broom').textContent='Room: '+(r==='boy'?'Boy':'Girl');slots=[DECS[r]];sel=-1;buildStk();drawDec();try{localStorage.setItem('pd.room',r)}catch(e){}}

/* fit the fixed room to the screen */
function fit(){K=Math.min(innerWidth/1000,innerHeight/700);const r=$('#room');r.style.transform='scale('+K+')';r.style.left=(innerWidth-1000*K)/2+'px';r.style.top=(innerHeight-700*K)/2+'px'}
addEventListener('resize',fit);fit();
/* decorations: tap one on the shelf, then tap one in the decor drawer to swap */
const R=n=>'<i></i>'.repeat(n);
const DEC={lamp:'<div class="it lamp"><div class="g"><i></i><i></i><i></i></div><div class="base"></div></div>',heart:'<div class="it heart">♥</div>',
 tama:'<div class="it tama"><b>^_^</b>'+R(3)+'</div>',gbc:'<div class="it gbc"><b></b>'+R(3)+'</div>',
 glasses:'<div class="it glass"><b></b><b></b><i></i></div>',nokia:'<div class="it nokia"><b></b><u>'+R(12)+'</u></div>',cube:'<div class="it cube"><b></b><i></i><i></i><i></i></div>',skate:'<div class="it skate"><b></b><i></i><i></i></div>',sneaker:'<div class="it" style="font-size:76px;line-height:1">👟</div>'};
const ROOMDEC={girl:['lamp','heart','tama','gbc','glasses','nokia'],boy:['cube','skate','lamp','gbc','nokia','sneaker']};
const WH={lamp:[70,210],heart:[84,84],tama:[68,84],gbc:[90,140],glasses:[104,44],nokia:[56,116],cube:[92,94],skate:[40,134],sneaker:[76,76]};
let DECS={girl:'lamp',boy:'cube'},slots=['lamp'],sel=-1,room='girl';
try{const v=JSON.parse(localStorage.getItem('pd.dec2')||'null');if(v&&DEC[v.girl]&&DEC[v.boy])DECS=v}catch(e){}
function drawDec(pop){document.querySelectorAll('.slot').forEach((el,i)=>{el.innerHTML=DEC[slots[i]];el.classList.toggle('sel',sel===i);if(pop===i){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}});
 const d=$('#dcs');d.innerHTML='';ROOMDEC[room].forEach(k=>{const m=document.createElement('span');m.className='mini'+(slots.includes(k)?' on':'');m.innerHTML=DEC[k];const w=WH[k][0],h=WH[k][1];m.firstChild.style.transform='scale('+Math.min(.4,30/w,44/h)+')';m.onclick=()=>pickDec(k);d.append(m)})}
function pickDec(k){slots[0]=k;DECS[room]=k;try{localStorage.setItem('pd.dec2',JSON.stringify(DECS))}catch(e){}drawDec(0)}
function initDec(){document.querySelectorAll('.slot').forEach((el,i)=>el.onclick=()=>$('#d3').classList.toggle('open'));drawDec()}

/* music notes drift out of the earbuds while a song plays (round player only) */
setInterval(()=>{if(!P.playing||!loaded||document.hidden||!$('#dm').classList.contains('portable'))return;
 const r=Math.random()<.5,x=r?761:655,y=r?549:546,n=document.createElement('span');n.className='note';n.textContent=['🎵','🎶'][Math.random()*2|0];
 n.style.left=x-10+(Math.random()*10-5)+'px';n.style.top=y-26+'px';$('#room').append(n);
 const dx=(r?14:-6)+Math.random()*22-6,dy=130+Math.random()*50;
 n.animate([{transform:'translate(0,0) scale(.6) rotate(-8deg)',opacity:0},{opacity:1,offset:.2},{transform:`translate(${dx}px,${-dy}px) scale(1.15) rotate(${Math.random()*30-15}deg)`,opacity:0}],{duration:2600,easing:'ease-out'}).finished.then(()=>n.remove(),()=>n.remove())},650);
let sk='portable';try{sk=localStorage.getItem('pd.skin')||sk}catch(e){}if(sk!=='portable')sk='classic';
try{room=localStorage.getItem('pd.room')==='boy'?'boy':'girl'}catch(e){}cds=cds.filter(c=>!hidden.includes(c.id));applyCust();renderStack();setSkin(sk);initDec();setRoom(room);
</script>
</body>
